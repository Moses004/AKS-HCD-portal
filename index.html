    <script>
      (function() {
        // Intercept and isolate third-party browser extension anomalies (e.g. MetaMask, Talisman, or Web3 wallet content scripts)
        function isExtensionNoise(msg, filename) {
          try {
            var str = ((msg || '') + ' ' + (filename || '')).toLowerCase();
            return (
              str.indexOf('chrome-extension://') !== -1 ||
              str.indexOf('moz-extension://') !== -1 ||
              str.indexOf('safari-web-extension://') !== -1 ||
              str.indexOf('talisman') !== -1 ||
              str.indexOf('metamask') !== -1 ||
              str.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 ||
              str.indexOf('inpage.js') !== -1 ||
              str.indexOf('failed to connect to metamask') !== -1 ||
              (str.indexOf('error restoring session') !== -1 &&
                (str.indexOf('metamask') !== -1 || str.indexOf('inpage.js') !== -1 || str.indexOf('extension') !== -1))
            );
          } catch (e) {
            return false;
          }
        }

        function serializeArgs(args) {
          var parts = [];
          for (var i = 0; i < args.length; i++) {
            var a = args[i];
            if (!a) continue;
            if (typeof a === 'string') {
              parts.push(a);
            } else if (typeof a === 'object') {
              if (a.message) parts.push(String(a.message));
              if (a.stack) parts.push(String(a.stack));
              try {
                parts.push(String(a));
              } catch (e) {}
            } else {
              parts.push(String(a));
            }
          }
          return parts.join(' ');
        }

        var origWarn = console.warn;
        var origError = console.error;

        console.warn = function() {
          if (isExtensionNoise(serializeArgs(arguments), '')) {
            return;
          }
          return origWarn.apply(console, arguments);
        };

        console.error = function() {
          if (isExtensionNoise(serializeArgs(arguments), '')) {
            return;
          }
          return origError.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          var err = event.error;
          var msg = (event.message || '') + (err ? ' ' + (err.message || '') + ' ' + (err.stack || '') : '');
          if (isExtensionNoise(msg, event.filename)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = '';
          if (reason) {
            msg = (reason.message || '') + ' ' + (reason.stack || '') + ' ' + String(reason);
          }
          if (isExtensionNoise(msg, '')) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
