name: Bootstrap committed npm lockfile

on:
  push:
    branches:
      - ci/committed-lockfile-staging-tests
    paths:
      - .github/workflows/bootstrap-lockfile.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ci/committed-lockfile-staging-tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          set -euo pipefail
          test -s package-lock.json
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(l.lockfileVersion !== 3 || l.packages[''].name !== p.name) process.exit(1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json; nothing to commit."
            exit 0
          fi
          git commit -m "build: commit npm dependency lockfile"
          git push origin HEAD:ci/committed-lockfile-staging-tests
