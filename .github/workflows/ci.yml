name: AKS-HCD CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aks-hcd-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend dependency, type-check, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require committed lockfile
        run: test -s package-lock.json
      - name: Install from lockfile
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build

  isolated-supabase-integration:
    name: Isolated local Supabase integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Initialize local Supabase configuration when absent
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
      - name: Start isolated local Supabase services
        run: supabase start -x studio,edge-runtime,logflare,vector,analytics,imgproxy
      - name: Apply migrations to the local database
        run: supabase db reset
      - name: Run integration verification suite against local Supabase only
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export VITE_SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export SUPABASE_URL="$VITE_SUPABASE_URL"
          export VITE_SUPABASE_ANON_KEY="${ANON_KEY:?Supabase CLI did not provide ANON_KEY}"
          export SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY"
          if [[ "$VITE_SUPABASE_URL" == *"refjawgovrmsyigtcfdl.supabase.co"* ]]; then
            echo "::error::Refusing to run integration tests against production."
            exit 1
          fi
          npm test
      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup

  backend-migration-safety:
    name: Backend migration and secret-safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify migration inventory and reject obvious service-role secrets
        shell: bash
        run: |
          set -euo pipefail
          test -d supabase/migrations
          migration_count="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)"
          test "$migration_count" -ge 27
          invalid_names="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | grep -Ev '^[0-9]{14}_.+\.sql$' || true)"
          if [ -n "$invalid_names" ]; then
            printf '::error::Migration filenames must start with a 14-digit version and underscore:\n%s\n' "$invalid_names"
            exit 1
          fi
          duplicate_versions="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]{14})_.*/\1/' | sort | uniq -d)"
          if [ -n "$duplicate_versions" ]; then
            printf '::error::Duplicate migration version(s): %s\n' "$duplicate_versions"
            exit 1
          fi
          if grep -RInE 'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*["\x27]?[A-Za-z0-9_./+=-]{20,}' src scripts; then
            echo '::error::Potential service-role credential committed to source.'
            exit 1
          fi
          if grep -Eq 'refjawgovrmsyigtcfdl\.supabase\.co|DEFAULT_SUPABASE_ANON_KEY[[:space:]]*=[[:space:]]*["\x27][A-Za-z0-9_-]{30,}' src/lib/supabase.ts; then
            echo '::error::Client Supabase configuration must not silently default to production.'
            exit 1
          fi
          echo "Validated $migration_count ordered migration files; no obvious service-role secret or production client fallback found."
