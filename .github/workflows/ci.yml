name: AKS-HCD CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "audit/**"

permissions:
  contents: read

concurrency:
  group: aks-hcd-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, type-check, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # package-lock.json is absent from the current repository snapshot.
        # Commit a reviewed lockfile, then change this step to npm ci.
        run: npm install --no-audit --no-fund

      - name: TypeScript check and lint
        run: npm run lint

      - name: Production build
        run: npm run build

  # Integration tests are intentionally excluded from this job. Existing
  # test scripts make live Supabase requests and some simulate upload/write
  # attempts. Run them only after they are guarded and configured for staging.
