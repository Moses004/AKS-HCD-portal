name: AKS-HCD Staging Browser Image Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aks-hcd-staging-browser-smoke
  cancel-in-progress: false

jobs:
  browser-smoke:
    name: Published activity image rendering
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      STAGING_PUBLISHED_ACTIVITY_URL: ${{ secrets.STAGING_PUBLISHED_ACTIVITY_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate staging activity URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_PUBLISHED_ACTIVITY_URL" || { echo 'Missing staging secret STAGING_PUBLISHED_ACTIVITY_URL'; exit 1; }
          case "$STAGING_PUBLISHED_ACTIVITY_URL" in https://*) ;; *) echo 'Activity URL must use HTTPS.'; exit 1 ;; esac
          case "$STAGING_PUBLISHED_ACTIVITY_URL" in *refjawgovrmsyigtcfdl.supabase.co*) echo 'Do not use a production Supabase URL.'; exit 1 ;; esac
      - name: Install browser test runtime
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify published activity media renders
        run: node scripts/staging_browser_image_smoke.mjs
      - name: Upload diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-published-activity-browser-check
          path: staging-published-activity.png
          if-no-files-found: ignore
          retention-days: 3
